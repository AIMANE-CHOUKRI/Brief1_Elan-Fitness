<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Élan Fitness, salle de sport à Casablanca : musculation, yoga, cardio et boxe fitness avec des coachs diplômés. Réservez votre cours d'essai gratuit.">
  <title>Élan Fitness | Salle de sport à Casablanca</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="en-tete">
    <div class="conteneur en-tete-contenu">
      <a href="#accueil" class="logo">Élan Fitness</a>

      <nav aria-label="Navigation principale">
        <ul class="menu">
          <li><a href="accueil.html">Accueil</a></li>
          <li><a href="apropos.html">À propos</a></li>
          <li><a href="programmes.html">Programmes</a></li>
          <li><a href="#contactez-nous" class="lien-actif">Contactez-nous</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section id="contactez-nous" class="hero">
        <div class="conteneur">
            <h1>Contactez-nous</h1><br><hr><br>
            <form action="#contactez-nous" method="post">
                <label for="nom"> Saisissez votre nom : </label>
                    <input type="text" id="nom" name="nom" required><br>
                <label for="prenom"> Saisissez votre prénom : </label>
                    <input type="text" id="prenom" name="prenom" required><br>
                <label for="email"> Saisissez votre e-mail : </label>
                    <input type="email" id="email" name="email" required><br>
                <label for="numtel"> Saisissez votre numéro de téléphone : </label>
                    <input type="tel" id="numtel" name="numtel" pattern="0[5-7][0-9]{8}" title="10 chiffres, par exemple 0612345678" placeholder="ex: 0663357492" required><br>
                <label for="msg"> Saisissez votre message : </label><br>
                    <textarea name="msg" id="msg" minlength="200" rows="3" cols="32" required></textarea><br><br>
                <input type="checkbox" id="consent" name="consent" required>
                  <label for="consent">J'accepte d'être recontacté</label><br><br>
                <button type="submit">Envoyer</button>
            </form>
        </div>
    </section>
  </main>

  <footer class="pied-de-page">
    <div class="conteneur">

      <div class="pied-haut">
        <div>
          <p class="logo logo-clair">Élan Fitness</p>
          <p class="slogan">Ton énergie, ton rythme.</p>
        </div>

        <nav aria-label="Navigation du pied de page">
          <ul class="menu menu-pied">
            <li><a href="accueil.html">Accueil</a></li>
            <li><a href="apropos.html">À propos</a></li>
            <li><a href="programmes.html">Programmes</a></li>
            <li><a href="#contactez-nous">Contactez-nous</a></li>
          </ul>
        </nav>
      </div>

      <div class="pied-bas">
        <p>Adresse : 12 rue des Palmiers, 20000 Casablanca</p>
        <p>&copy; 2026 Élan Fitness — Projet pédagogique fictif</p>
      </div>

    </div>
  </footer>
</body>
</html>
